name: Manual Release (Binstall Compatible)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to release (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build & Package
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: crabgrid.exe
            archive_name: crabgrid-x86_64-pc-windows-msvc.zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_name: crabgrid
            archive_name: crabgrid-x86_64-unknown-linux-gnu.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            bin_name: crabgrid
            archive_name: crabgrid-aarch64-apple-darwin.tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            bin_name: crabgrid
            archive_name: crabgrid-x86_64-apple-darwin.tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Binary
        run: cargo build --release --target ${{ matrix.target }}

      # Package the binary into the root of the archive file
      - name: Create Archive (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../${{ matrix.archive_name }} ${{ matrix.bin_name }}

      - name: Create Archive (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf ../../../${{ matrix.archive_name }} ${{ matrix.bin_name }}

      - name: Upload Artifacts to Job
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-archive
          path: ${{ matrix.archive_name }}

  create-release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all job artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create Release and Upload Files
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          files: |
            crabgrid-x86_64-pc-windows-msvc.zip
            crabgrid-x86_64-unknown-linux-gnu.tar.gz
            crabgrid-aarch64-apple-darwin.tar.gz
            crabgrid-x86_64-apple-darwin.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
