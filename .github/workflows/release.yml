name: Manual Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'v0.0.1'
        required: true
        type: string

jobs:
  build:
    name: Build CLI
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: crabgrid-windows.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: crabgrid-linux
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: crabgrid-apple-arm
          - os: macos-13 # Intel Mac
            target: x86_64-apple-darwin
            artifact_name: crabgrid-apple-intel

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact_name == 'my-cli-windows.exe' && 'my-cli.exe' || 'my-cli' }}

  create-release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release and Upload Files
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          files: |
            windows/crabgrid.exe
            linux/crabgrid
            apple-arm/crabgrid
            apple-intel/crabgrid
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
